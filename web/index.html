<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230ea5e9'/%3E%3Cpath d='M9 21V11h4.2a3.4 3.4 0 010 6.8H12V21H9zm3-5.6h1.1a1.2 1.2 0 000-2.4H12v2.4z' fill='white'/%3E%3Ccircle cx='22' cy='16' r='3' fill='white'/%3E%3C/svg%3E"
    />
    <title>vpn-to-proxy</title>
    <!--
      Тему выставляем до первой отрисовки, иначе при тёмной теме экран
      успевает мигнуть светлым. Скрипт разрешён в CSP по SHA-256 —
      при его изменении нужно пересчитать хеш в server/src/http/app.ts.
    -->
    <script>try{var m=localStorage.getItem('vtp-theme');var d=m==='dark'||(m!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.classList.toggle('dark',d)}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
